<script>
  (function () {
    var root = document.currentScript && document.currentScript.previousElementSibling;
    if (!root || !root.classList.contains("sc-people-list")) return;
    var status = root.querySelector(".sc-people-list__status");
    var timer;
    root.addEventListener("click", function (event) {
      var button = event.target.closest(".sc-people-list__copy");
      if (!button || !navigator.clipboard) return;
      var email = button.getAttribute("data-email");
      navigator.clipboard.writeText(email).then(
        function () {
          var previous = root.querySelector(".sc-people-list__copy--done");
          if (previous) previous.classList.remove("sc-people-list__copy--done");
          button.classList.add("sc-people-list__copy--done");
          status.textContent = "Copied " + email;
          clearTimeout(timer);
          timer = setTimeout(function () {
            button.classList.remove("sc-people-list__copy--done");
            status.textContent = "";
          }, 2000);
        },
        function () {},
      );
    });
  })();
</script>

<style>
  .sc-people-list {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 24px;
    background: #ffffff;
    color: #17171b;
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    font-weight: 500;
    line-height: normal;
    letter-spacing: -0.03em;
  }
  .sc-people-list *,
  .sc-people-list *::before,
  .sc-people-list *::after {
    box-sizing: border-box;
  }
  .sc-people-list__title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    font: inherit;
    font-size: 16px;
    line-height: 19px;
    letter-spacing: -0.02em;
  }
  .sc-people-list__icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    fill: none;
    stroke: #6b6b77;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* An ARIA table on a grid: the email column only shrinks (and truncates) when space runs out. */
  .sc-people-list__table {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 8px 24px;
  }
  .sc-people-list__row {
    display: grid;
    grid-column: span 2;
    grid-template-columns: subgrid;
  }
  .sc-people-list__row--head {
    margin-bottom: 4px;
    color: #6b6b77;
  }
  .sc-people-list__label {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sc-people-list__person {
    display: flex;
    align-items: center;
    gap: 12px;
    white-space: nowrap;
  }
  .sc-people-list__avatar {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background-image:
      radial-gradient(71% 71% at -15% 21%, rgb(222 222 236 / 0.5), rgb(222 222 236 / 0)),
      radial-gradient(82% 82% at 94% 20%, rgb(240 240 247 / 0.45), rgb(240 240 247 / 0)),
      linear-gradient(#c6c6d1, #6b6b77);
    box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.3);
  }
  .sc-people-list__avatar--blue {

      radial-gradient(82% 82% at 94% 20%, rgb(255 156 52 / 0.38), rgb(255 156 52 / 0)),
      linear-gradient(#f1a7df, #4642ec);
  }
  .sc-people-list__avatar--red {
    background-image:
      radial-gradient(107% 107% at 90% -7%, rgb(247 159 255), rgb(247 159 255 / 0)),
      radial-gradient(113% 113% at 66% 99%, rgb(245 40 47 / 0.94), rgb(245 40 47 / 0)),
      linear-gradient(#fffcf7, #f7608a);
  }
  .sc-people-list__avatar--green {
    background-image:
      radial-gradient(116% 116% at 121% -12%, rgb(138 147 255 / 0.69), rgb(138 147 255 / 0)),
      radial-gradient(69% 69% at 150% 100%, rgb(191 224 142 / 0.74), rgb(191 224 142 / 0)),
      linear-gradient(#aff6df, #38b372);
  }
  .sc-people-list__avatar > span {
    background-image: linear-gradient(#fafafa 25%, rgba(255, 255, 255, 0.5) 72.5%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-family: "Geist", "Inter", ui-sans-serif, system-ui, sans-serif;
    font-size: 12px;
    font-weight: 600;
    line-height: 20px;
    letter-spacing: -0.03em;
  }
  .sc-people-list__email {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  /* Hovering or focusing an email turns it into a blue link with a copy button. */
  .sc-people-list__link {
    min-width: 0;
    overflow: hidden;
    border-radius: 2px;
    color: #17171b;
    text-decoration: none;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color 0.15s;
  }
  .sc-people-list__copy {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    margin: -4px;
    padding: 4px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .sc-people-list__copy .sc-people-list__icon {
    stroke: #2867ef;
  }
  .sc-people-list__check-icon,
  .sc-people-list__copy--done .sc-people-list__copy-icon {
    display: none;
  }
  .sc-people-list__copy--done .sc-people-list__check-icon {
    display: block;
  }
  .sc-people-list__email:focus-within .sc-people-list__link {
    color: #2867ef;
  }
  .sc-people-list__email:focus-within .sc-people-list__copy,
  .sc-people-list__copy--done {
    opacity: 1;
  }
  @media (hover: hover) {
    .sc-people-list__email:hover .sc-people-list__link {
      color: #2867ef;
    }
    .sc-people-list__email:hover .sc-people-list__copy {
      opacity: 1;
    }
  }
  @media (hover: none) {
    .sc-people-list__copy {
      opacity: 1;
    }
  }
  .sc-people-list__link:focus-visible,
  .sc-people-list__copy:focus-visible {
    outline: 2px solid #2867ef;
    outline-offset: 1px;
  }
  .sc-people-list__status {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
