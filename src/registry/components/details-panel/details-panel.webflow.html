<section class="sc-details-panel">
  <h2 class="sc-details-panel__title">
    <svg class="sc-details-panel__icon"><use href="#sc-details-panel-buildings" /></svg>
    Company details
  </h2>
  <div class="sc-details-panel__body">
    <dl class="sc-details-panel__properties">
      <dt>
        <svg class="sc-details-panel__icon"><use href="#sc-details-panel-library" /></svg>Name
      </dt>
      <dd>Acme Corporation.</dd>
      <dt>
        <svg class="sc-details-panel__icon"><use href="#sc-details-panel-globe" /></svg>Website
      </dt>
      <dd>
        <a
          class="sc-details-panel__link"
          href="https://www.acme.studio/us"
          target="_blank"
          rel="noreferrer"
        >
          <span class="sc-details-panel__text">www.acme.studio/us</span>
          <svg class="sc-details-panel__icon"><use href="#sc-details-panel-external" /></svg>
        </a>
      </dd>
      <dt>
        <svg class="sc-details-panel__icon"><use href="#sc-details-panel-light-bulb" /></svg
        >Industry
      </dt>
      <dd>
        <ul class="sc-details-panel__chips">
          <li class="sc-details-panel__chip">Tech</li>
          <li class="sc-details-panel__chip">Sales</li>
          <li class="sc-details-panel__chip">Marketing</li>
        </ul>
      </dd>
      <dt>
        <svg class="sc-details-panel__icon"><use href="#sc-details-panel-document-report" /></svg
        >Size
      </dt>
      <dd>100-500</dd>
      <dt>
        <svg class="sc-details-panel__icon"><use href="#sc-details-panel-currency-dollar" /></svg
        >Revenue
      </dt>
      <dd>est. 100,000.00 USD</dd>
      <dt>
        <svg class="sc-details-panel__icon"><use href="#sc-details-panel-globe-stand" /></svg
        >Location
      </dt>
      <dd>San Francisco, US</dd>
    </dl>
    <button type="button" class="sc-details-panel__add">
      <svg class="sc-details-panel__icon sc-details-panel__icon--bold">
        <use href="#sc-details-panel-plus" />
      </svg>
      Add a property
    </button>
  </div>
  <div class="sc-details-panel__apps">
    <a
      class="sc-details-panel__app"
      href="https://login.salesforce.com"
      target="_blank"
      rel="noreferrer"
    >
      <svg class="sc-details-panel__logo sc-details-panel__logo--wide">
        <use href="#sc-details-panel-salesforce" />
      </svg>
      <span class="sc-details-panel__text">View in Salesforce</span>
      <svg class="sc-details-panel__icon sc-details-panel__external">
        <use href="#sc-details-panel-external" />
      </svg>
    </a>
    <a class="sc-details-panel__app" href="https://app.attio.com" target="_blank" rel="noreferrer">
      <svg class="sc-details-panel__logo"><use href="#sc-details-panel-attio" /></svg>
      <span class="sc-details-panel__text">View in Attio</span>
      <svg class="sc-details-panel__icon sc-details-panel__external">
        <use href="#sc-details-panel-external" />
      </svg>
    </a>
  </div>
</section>

<style>
  .sc-details-panel {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 470px;
    padding: 24px 0;
    border-radius: 0 0 6px 0;
    background: #ffffff;
    color: #17171b;
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    font-weight: 500;
    line-height: normal;
    letter-spacing: -0.03em;
  }
  .sc-details-panel *,
  .sc-details-panel *::before,
  .sc-details-panel *::after {
    box-sizing: border-box;
  }
  .sc-details-panel__title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    padding: 0 24px;
    font: inherit;
    font-size: 16px;
    letter-spacing: -0.02em;
  }
  .sc-details-panel__icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .sc-details-panel__icon--bold {
    stroke-width: 2;
  }
  .sc-details-panel__title .sc-details-panel__icon {
    color: #6b6b77;
  }
  .sc-details-panel__body {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 8px 24px;
    padding: 0 24px;
  }
  .sc-details-panel__properties {
    display: grid;
    grid-column: 1 / -1;
    grid-template-columns: subgrid;
    row-gap: 8px;
    margin: 0;
  }
  .sc-details-panel__properties dt {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 28px;
    color: #6b6b77;
    font-weight: inherit;
    white-space: nowrap;
  }
  .sc-details-panel__properties dd {
    display: flex;
    align-items: center;
    min-width: 0;
    min-height: 28px;
    margin: 0;
  }
  .sc-details-panel__text {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .sc-details-panel__link {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    border-radius: 2px;
    color: #2867ef;
    text-decoration: none;
    text-underline-offset: 2px;
  }
  .sc-details-panel__link:hover {
    text-decoration: underline;
  }
  .sc-details-panel__chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .sc-details-panel__chip {
    display: flex;
    align-items: center;
    height: 28px;
    margin: 0;
    padding: 0 8px;
    border: 0.5px solid #f4f4fb;
    border-radius: 6px;
    background: #ffffff;
    box-shadow:
      0 0.5px 0.5px 0.25px rgba(154, 157, 166, 0.03),
      0 1.4px 1.4px -0.7px rgba(44, 51, 69, 0.04);
    color: #6b6b77;
  }
  .sc-details-panel__add {
    display: flex;
    grid-column: 1;
    justify-self: start;
    align-items: center;
    gap: 8px;
    height: 28px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #17171b;
    font: inherit;
    letter-spacing: inherit;
    white-space: nowrap;
    cursor: pointer;
    transition: color 0.15s;
  }
  .sc-details-panel__add .sc-details-panel__icon {
    color: #2867ef;
  }
  .sc-details-panel__add:hover {
    color: #2867ef;
  }
  .sc-details-panel__apps {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    padding: 0 24px;
  }
  .sc-details-panel__app {
    display: flex;
    flex: 1 1 0;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 0;
    height: 36px;
    padding: 0 12px;
    border: 1px solid rgba(178, 178, 191, 0.15);
    border-radius: 8px;
    background: linear-gradient(rgba(255, 255, 255, 0), #ffffff);
    box-shadow:
      0 0.5px 0.5px 0.25px rgba(154, 157, 166, 0.03),
      0 1.4px 1.4px -0.7px rgba(44, 51, 69, 0.04);
    color: #17171b;
    text-decoration: none;
  }
  .sc-details-panel__app:hover {
    background: #fafafa;
  }
  .sc-details-panel__logo {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    object-fit: contain;
  }
  .sc-details-panel__logo--wide {
    width: 26px;
  }
  .sc-details-panel__external {
    color: #c6c6d1;
    transition: color 0.15s;
  }
  .sc-details-panel__app:hover .sc-details-panel__external {
    color: #6b6b77;
  }
  .sc-details-panel__link:focus-visible,
  .sc-details-panel__add:focus-visible,
  .sc-details-panel__app:focus-visible {
    outline: 2px solid #2867ef;
    outline-offset: 2px;
  }
</style>
