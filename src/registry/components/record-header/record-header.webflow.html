<!--
  Record Header · seecode
  Paste into a Webflow Code Embed (Add panel → Elements → Code Embed).
  Classes are prefixed with "sc-record-header" so they never clash with your site's styles.
  To use your own logo, replace the .sc-record-header__logo span with
  <img class="sc-record-header__image" src="…" alt="" />.
-->
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap"
/>

<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <symbol id="sc-record-header-star" viewBox="0 0 24 24">
    <path
      d="M12 17.75l-6.172 3.245l1.179 -6.873l-5 -4.867l6.9 -1l3.086 -6.253l3.086 6.253l6.9 1l-5 4.867l1.179 6.873l-6.158 -3.245"
    />
  </symbol>
  <symbol id="sc-record-header-pencil" viewBox="0 0 24 24">
    <path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4M13.5 6.5l4 4" />
  </symbol>
  <symbol id="sc-record-header-trash" viewBox="0 0 24 24">
    <path
      d="M19 7l-.867 12.142A2 2 0 0 1 16.138 21H7.862a2 2 0 0 1-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v3M4 7h16"
    />
  </symbol>
</svg>

<header class="sc-record-header">
  <div class="sc-record-header__lead">
    <div class="sc-record-header__identity">
      <span class="sc-record-header__logo" aria-hidden="true">
        <svg viewBox="0 0 16 16">
          <path d="M1.7 7.2 7.3 2.3" />
          <path d="m5.2 10.3 5.6-4.9" opacity="0.9" />
          <path d="m8.2 13.3 5.6-4.9" opacity="0.8" />
        </svg>
      </span>
      <h1 class="sc-record-header__name">Acme Inc</h1>
      <button
        type="button"
        class="sc-record-header__favorite"
        aria-label="Favorite"
        aria-pressed="false"
      >
        <svg class="sc-record-header__star"><use href="#sc-record-header-star" /></svg>
      </button>
    </div>
    <span class="sc-record-header__dot" aria-hidden="true"></span>
    <a
      class="sc-record-header__website"
      href="https://www.acme.studio"
      target="_blank"
      rel="noreferrer"
      >www.acme.studio</a
    >
  </div>
  <div class="sc-record-header__actions">
    <button type="button" class="sc-record-header__button sc-record-header__button--edit">
      <svg class="sc-record-header__icon"><use href="#sc-record-header-pencil" /></svg>
      <span class="sc-record-header__label">Edit</span>
    </button>
    <button type="button" class="sc-record-header__button sc-record-header__button--delete">
      <svg class="sc-record-header__icon"><use href="#sc-record-header-trash" /></svg>
      <span class="sc-record-header__label">Delete</span>
    </button>
  </div>
</header>

<style>
  .sc-record-header {
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    width: 100%;
    padding: 8px 16px;
    border-radius: 6px 6px 0 0;
    background: #ffffff;
    box-shadow: 0 6px 20px rgba(27, 19, 94, 0.03);
    color: #17171b;
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    font-weight: 500;
    line-height: normal;
    letter-spacing: -0.03em;
  }
  .sc-record-header *,
  .sc-record-header *::before,
  .sc-record-header *::after {
    box-sizing: border-box;
  }
  .sc-record-header__lead,
  .sc-record-header__identity {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 0;
  }
  .sc-record-header__identity {
    gap: 12px;
  }
  .sc-record-header__logo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: 50%;
    background:
      radial-gradient(90% 80% at 10% 0%, rgba(190, 255, 235, 0.9), transparent 70%),
      radial-gradient(90% 80% at 100% 10%, rgba(170, 215, 245, 0.95), transparent 75%),
      linear-gradient(#8ad6c2, #62c896 55%, #46be7b);
    box-shadow:
      inset 0 1px 4px rgba(255, 255, 255, 0.3),
      0 0 0 0.2px rgba(40, 18, 18, 0.16);
  }
  .sc-record-header__image {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 0 0.5px rgba(40, 18, 18, 0.16);
  }
  .sc-record-header__logo svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: #ffffff;
    stroke-width: 2.4;
    stroke-linecap: round;
  }
  .sc-record-header__name {
    overflow: hidden;
    margin: 0;
    font: inherit;
    font-weight: 600;
    letter-spacing: inherit;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .sc-record-header__favorite {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    margin: -4px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #c6c6d1;
    cursor: pointer;
    transition: color 0.15s;
  }
  .sc-record-header__favorite:hover {
    color: #6b6b77;
  }
  .sc-record-header__favorite[aria-pressed="true"] {
    color: #f5a524;
  }
  .sc-record-header__star {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.85;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .sc-record-header__favorite[aria-pressed="true"] .sc-record-header__star {
    fill: currentColor;
  }
  .sc-record-header__dot {
    width: 4px;
    height: 4px;
    flex-shrink: 0;
    border-radius: 50%;
    background: #c6c6d1;
  }
  .sc-record-header__website {
    overflow: hidden;
    border-radius: 2px;
    color: #6b6b77;
    text-decoration: none;
    white-space: nowrap;
    text-overflow: ellipsis;
    transition: color 0.15s;
  }
  .sc-record-header__website:hover {
    color: #17171b;
  }
  .sc-record-header__actions {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .sc-record-header__button {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 36px;
    flex-shrink: 0;
    padding: 0 12px;
    border: 1px solid rgba(178, 191, 191, 0.15);
    border-radius: 8px;
    background: linear-gradient(rgba(255, 255, 255, 0), #ffffff);
    box-shadow:
      0 0.5px 0.5px 0.25px rgba(154, 157, 166, 0.03),
      0 1.4px 1.4px -0.7px rgba(44, 51, 69, 0.04);
    color: #17171b;
    font: inherit;
    letter-spacing: inherit;
    cursor: pointer;
  }
  .sc-record-header__button:hover {
    background: #fafafa;
  }
  .sc-record-header__icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: color 0.15s;
  }
  .sc-record-header__button--edit .sc-record-header__icon {
    color: #c6c6d1;
  }
  .sc-record-header__button--edit:hover .sc-record-header__icon {
    color: #6b6b77;
  }
  .sc-record-header__button--delete .sc-record-header__icon {
    color: #e00d29;
  }
  .sc-record-header__favorite:focus-visible,
  .sc-record-header__website:focus-visible,
  .sc-record-header__button:focus-visible {
    outline: 2px solid #2867ef;
    outline-offset: 1px;
  }
  @media (max-width: 639px) {
    .sc-record-header__button {
      padding: 0 8px;
    }
    .sc-record-header__label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
  }
</style>

<script>
  document
    .querySelectorAll(".sc-record-header__favorite:not([data-sc-ready])")
    .forEach(function (button) {
      button.setAttribute("data-sc-ready", "");
      button.addEventListener("click", function () {
        var pressed = button.getAttribute("aria-pressed") === "true";
        button.setAttribute("aria-pressed", String(!pressed));
      });
    });
</script>
