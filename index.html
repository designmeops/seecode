<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts).
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("seecode:theme") || "null");
          var dark =
            saved === "dark" ||
            (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (dark) document.querySelector('meta[name="theme-color"]').content = "#0b0b0c";
        } catch (error) {}
      })();
    </script>
    <meta
      name="description"
      content="seecode is a marketplace of UI components for Next.js, Framer and Webflow. Preview them live and copy the code for your platform in one click."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>seecode — Component marketplace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
